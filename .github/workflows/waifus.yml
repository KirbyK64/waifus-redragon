# Waifus Redragon: compila o app (fork do AIRI) sob pedido. Nada roda sozinho: sem schedule, sem push.
# Fonte: o AIRI no commit 747d4f6 com as mudanças da Integraction (ver WAIFUS.md).
#   alvo=web      versão de navegador (stage-web), artefato dist.zip
#   alvo=windows  instalador .exe sem assinatura (stage-tamagotchi + electron-builder)
#   alvo=android  APK de teste assinado com a chave de debug (stage-pocket + Capacitor)
#   alvo=prova    instala um instalador já publicado num Windows limpo, abre e fotografa (.github/waifus-prova)
# O alvo windows também roda a prova no instalador que acabou de compilar.
# iPhone fica fora daqui: vai pelo caminho do Mac da casa (MAC-COTA), com o registro do app na App Store Connect.
name: waifus
run-name: waifus ${{ inputs.alvo }}

on:
  workflow_dispatch:
    inputs:
      alvo:
        description: web, windows, android ou prova
        required: true
        default: web
      instalador:
        description: 'só pro alvo prova: endereço do .exe (vazio = o da versão v0.1.0)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: waifus-${{ inputs.alvo }}
  cancel-in-progress: true

env:
  # Sem analytics: o build do AIRI manda eventos pro PostHog da moeru-ai quando isto é true.
  VITE_ENABLE_ANALYTICS: 'false'

jobs:
  web:
    if: inputs.alvo == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@26.7.0
          cache: true
          install: false
      # NOTICE: o lockfile é o do AIRI; a dependência nova (espeak) entra na instalação.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build:packages
      - run: pnpm -F @proj-airi/stage-web run build
      - run: cd apps/stage-web/dist && zip -qr "$RUNNER_TEMP/dist.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: waifus-web
          path: ${{ runner.temp }}/dist.zip
          retention-days: 3

  windows:
    if: inputs.alvo == 'windows'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@26.7.0
          cache: true
          install: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build:packages
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.1'
          use-dotnet: true
          include-templates: true
      - name: Godot stage
        working-directory: ./engines/stage-tamagotchi-godot
        shell: bash
        run: |
          mkdir -p out/win
          godot --headless --export-release "Windows Desktop" out/win/godot-stage.exe
      - run: pnpm run -F @proj-airi/stage-tamagotchi build && pnpm -F @proj-airi/stage-tamagotchi exec electron-builder build --windows --x64 --publish=never
      - uses: actions/upload-artifact@v4
        with:
          name: waifus-windows
          path: apps/stage-tamagotchi/dist/*-setup.exe
          if-no-files-found: error
          retention-days: 3
      - name: Prova no Windows
        shell: pwsh
        env:
          # Código de teste com teto baixo na ponte da Integraction; revogável em _ops/waifus-redragon/codigos.php.
          WAIFUS_CODIGO: ${{ secrets.WAIFUS_CODIGO_TESTE }}
        run: |
          npm i --no-save --prefix .github/waifus-prova playwright-core@1.56.1
          $exe = (Get-ChildItem apps/stage-tamagotchi/dist/*-setup.exe | Select-Object -First 1).FullName
          node .github/waifus-prova/prova.mjs $exe "$env:RUNNER_TEMP\prova"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waifus-windows-prova
          path: ${{ runner.temp }}/prova
          retention-days: 7

  prova:
    if: inputs.alvo == 'prova'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/waifus-prova
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baixar o instalador
        shell: pwsh
        env:
          INSTALADOR: ${{ inputs.instalador }}
        run: |
          $url = if ($env:INSTALADOR) { $env:INSTALADOR } else { 'https://github.com/KirbyK64/waifus-redragon/releases/download/v0.1.0/WaifusRedragon-0.1.0-windows-x64-setup.exe' }
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\setup.exe"
      - name: Prova no Windows
        shell: pwsh
        env:
          WAIFUS_CODIGO: ${{ secrets.WAIFUS_CODIGO_TESTE }}
        run: |
          npm i --no-save --prefix .github/waifus-prova playwright-core@1.56.1
          node .github/waifus-prova/prova.mjs "$env:RUNNER_TEMP\setup.exe" "$env:RUNNER_TEMP\prova"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waifus-prova
          path: ${{ runner.temp }}/prova
          retention-days: 7

  android:
    if: inputs.alvo == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # NOTICE: o padrão da action pede o pacote 'tools', que o Google tirou do ar ("Failed to find package
      # 'tools'", 21/10/2026). Os mesmos build-tools do release-pocket-android do AIRI.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.1.0
      - uses: pnpm/setup@v2
        with:
          runtime: node@26.7.0
          cache: true
          install: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build:packages
      - run: pnpm -F @proj-airi/stage-pocket run build
      - run: pnpm -F @proj-airi/stage-pocket exec cap sync android
      - name: APK de teste
        working-directory: apps/stage-pocket/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: waifus-android
          path: apps/stage-pocket/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
