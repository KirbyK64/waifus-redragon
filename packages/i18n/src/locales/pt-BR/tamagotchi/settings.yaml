        controller: Controle
      input-actions:
        move-body-head: Mover corpo e cabeça
        tilt-head: Inclinar a cabeça
        blink: Piscar
        open-mouth: Abrir a boca
        mouth-shape: Mudar o formato da boca
      eye-view:
