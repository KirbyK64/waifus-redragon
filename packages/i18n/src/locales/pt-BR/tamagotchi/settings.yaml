          mouth-form: Formato
          mouth-open: Abertura
      joystick-label: Joystick de movimento do Live2D
      wave:
        toggle: Modo barquinho
      instructions: Arraste o joystick ou use as setas para X/Y. R aperta um pouco os olhos. F aperta mais. C fecha os olhos. W/S muda o formato da boca. Espaço abre a boca. A/D move o corpo no eixo X. Q/E inclina a cabeça. Ao soltar as teclas, tudo volta suave para o centro.
      parameter-note: O joystick controla X/Y. R equivale a 1/3 de olhos apertados. F equivale a 2/3. C equivale a olhos totalmente fechados. W/S equivale a formato da boca ±1. Espaço equivale a boca aberta 1. A/D equivale a corpo X ±10°. Q/E equivale a cabeça Z ±30°.
      input:
