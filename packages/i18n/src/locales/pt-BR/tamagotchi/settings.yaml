allow-visible-on-all-workspaces:
  title: Visível em todas as áreas de trabalho
  description: Deixa a janela visível em todas as áreas de trabalho (só no macOS).
microphone-permission:
  prompt:
    title: Permitir acesso ao microfone?
    description: O AIRI usa o microfone para entrada de voz e transcrição. Esta escolha vale até você redefini-la nas Configurações.
    allow: Permitir
    deny: Negar
  states:
    not-determined: Não definido
    granted: Permitido
    denied: Negado
  settings:
    title: Microfone
    description: Controle se o AIRI pode usar o microfone. Redefinir esta escolha para o microfone agora e pergunta de novo na próxima vez.
    revoke: Tirar o acesso
    reset: Redefinir escolha
spotlight:
  errors:
    unknown: Erro desconhecido
    prefix: 'Algo deu errado: {message}'
    shortcutRegistrationFailed: 'Algo deu errado: não foi possível registrar o atalho do Spotlight.'
pages:
  modules:
    mcp-server:
      description: Conecte e gerencie servidores e ferramentas MCP
      title: Servidor MCP
  system:
    general:
      hide-app-icon:
        title: Esconder o ícone da barra de tarefas / Dock
        description: Deixa o AIRI só na bandeja. Use o menu da bandeja para abrir janelas ou sair. As mudanças valem na hora.
        load-error: Não foi possível carregar a configuração do ícone do app.
        save-error: Não foi possível atualizar a configuração do ícone do app.
    sections:
      section:
        window-shortcuts:
          title: Atalhos de teclado
    window-shortcuts:
      description: Altere os atalhos da janela.
      title: Atalhos da janela
      empty: Não definido
      spotlight:
        title: Atalho do Spotlight
        description: Clique no atalho e aperte o atalho novo. Aperte Esc para cancelar.
      push-to-talk:
        title: Atalho de apertar para falar
        description: Segure este atalho em qualquer app enquanto fala com o AIRI. Clique no atalho e aperte o atalho novo. Aperte Esc para cancelar.
        inactive: Este atalho só funciona quando o modo de entrada da Audição é Apertar para falar e o microfone está ligado.
      actions:
        recording: Aperte as teclas
        reset: Redefinir
      errors:
        load: Não foi possível carregar o atalho
        conflict: Este atalho já está em uso.
        failed: Não foi possível atualizar o atalho
        requiresModifier: Use pelo menos uma destas teclas, Cmd, Ctrl, Alt ou Super.
        requiresHoldModifier: Use Cmd, Ctrl, Alt ou Super, ou uma tecla de função como F13. Só o Shift não basta.
        denied: O AIRI não consegue ler teclas globais. Permita o AIRI nas configurações de Acessibilidade e tente de novo.
        unsupported: Este sistema não consegue detectar quando você solta um atalho global.
      toggle-move:
        label: Ligar ou desligar mover
      toggle-resize:
        label: Ligar ou desligar redimensionar
      toggle-ignore-mouse-event:
        label: Ligar ou desligar ignorar o mouse
      press-keys: Aperte as teclas...
    developer:
      sections:
        section:
          use-window-mouse:
            title: Ferramenta useWindowMouse
            description: Testa a posição do cursor na janela do Electron
devtools:
  title: Desenvolvedor
  pages:
    context-flow:
      title: Fluxo de contexto
    presence-bubble:
      title: Balão de presença
      description: Controle o balão acima da personagem e acompanhe na janela principal
      override:
        title: Controlar o balão daqui
        description: Com isto desligado, o palco não mostra balão a não ser durante uma rodada de conversa.
      thinking:
        title: Pensando
        description: Mostra os pontinhos. Tem prioridade sobre a contagem de não lidas.
      unread:
        title: Mensagens não lidas
        description: Aparece como um painel na cabeça, com uma marca e a contagem.
      main-window-note: As mudanças aparecem na janela principal do AIRI.
    live2d-ambient-light:
      title: Luz ambiente do Live2D
      description: Ajuste a amostragem da tela e o shader de luz colorida do Live2D
      controls:
        title: Fonte de luz e saída
      enabled:
        title: Luz ambiente
        description: Aplica o filtro de luz ambiente no modelo Live2D ativo.
      source:
        title: Fonte de luz
        options:
          screen-capture: Captura da tela
          forced-color: Cor forçada
      mode:
        title: Modo de iluminação
        options:
          window-gradient: Degradê da janela
          global: Ambiente global
      forced-color:
        title: Cor de teste
        description: Aplica esta cor sem capturar a tela.
      strength:
        title: Força da luz
        description: Define a intensidade geral do efeito. 1 é o visual planejado, e até 3 deixa o contorno de luz e a contraluz mais fortes.
      squint:
        title: Apertar os olhos com mudança forte de brilho
        description: Fecha um pouco os olhos quando a tela clareia mais rápido do que a personagem se acostumou. Tela que fica clara deixa os olhos abertos. 0 desliga isto.
      main-window-note: As mudanças aparecem na janela principal do AIRI.
      diagnostics:
        title: Diagnóstico da captura
        waiting: Esperando o diagnóstico da janela principal do AIRI.
        status:
          disabled: Desligado
          starting: Iniciando
          capturing: Capturando
          forced-color: Cor forçada
          error: Erro
        capture:
          title: Estado da captura
          description: Confira o monitor escolhido, o tamanho da captura e as coordenadas excluídas.
          display: Monitor e limites
          video-size: Vídeo de origem
          sample-size: Quadro de amostra
          window-bounds: Limites da janela do AIRI
          excluded-region: Região excluída
          exposure: Exposição da tela
          behind-luminance: Luz atrás da personagem
          updated: Última atualização
        preview:
          title: Captura reduzida
          description: O retângulo vermelho marca a janela do AIRI. O retângulo tracejado marca a área que os mapas de luz cobrem.
          unavailable: Nenhum quadro capturado disponível.
        pixels:
          title: Decisões por pixel
          total: Total
          accepted: Aceitos
          excluded: Pintados
          transparent: Transparentes
          see-through: Vazados
        maps:
          title: Mapas de luz
          window: Cada mapa cobre a janela do AIRI e meia janela em cada lado. O contorno marca a janela.
          unavailable: Nenhum ambiente disponível.
          target: Medido
          applied: Aplicado depois da suavização
          surround:
            title: Mapa do entorno
            description: Desfoque largo da tela em volta e atrás da janela. Leva a cor da luz e o lado de onde ela vem.
          contact:
            title: Mapa de contato
            description: Desfoque estreito do mesmo conteúdo. Este mapa comanda o contorno de luz e a borda da contraluz.
      sampling:
        title: Amostragem da tela
        capture-interval:
          title: Intervalo de captura
          description: Define o tempo entre as amostras da tela. A captura roda nesse ritmo.
        response-time:
          title: Tempo de resposta
          description: Define a rapidez com que as cores amostradas acompanham uma mudança na tela.
        sample-width:
          title: Tamanho da amostra
          description: Define a largura do quadro reduzido. Um quadro mais largo põe mais detalhe nos mapas de luz. A altura acompanha o seu monitor.
        neutral-color-weight:
          title: Peso das cores neutras
          description: Define o peso mínimo das cores pouco saturadas. Conteúdo colorido conta mais que cinza.
      shader:
        title: Resposta do shader
        dark-base:
          title: Brilho mínimo
          description: Define o brilho do modelo sobre uma tela preta. Uma tela branca mostra o modelo como foi desenhado, e uma tela mais escura escurece ele até esse mínimo.
        base-curve:
          title: Curva de brilho
          description: Define como o brilho do modelo sobe entre o mínimo e a arte. Acima de 1, uma tela meio iluminada deixa o modelo mais perto do mínimo.
        local-share:
          title: Parte da luz local
          description: Define quanto do brilho do modelo segue a luz ao lado dele, e não a tela inteira. Em 0, o modelo fica com o mesmo brilho em qualquer lugar da tela.
        tint:
          title: Tingimento
          description: Define quanto da cor da tela o modelo pega. Em 0, só o brilho da tela chega ao modelo.
        color-boost:
          title: Reforço de cor na luz fraca
          description: Define quanta cor extra o modelo pega de luz fraca mas saturada. O brilho fica onde a luz deixou, e nenhum canal fica abaixo do modelo sem luz.
        wrap-intensity:
          title: Intensidade do contorno de luz
          description: Define o quanto a cor do fundo vaza na borda do modelo.
        wrap-saturation:
          title: Saturação do contorno de luz
          description: Define quanto da cor da tela o contorno de luz mantém. 0 soma luz branca do mesmo brilho. 1 soma a cor inteira da tela.
        backlight:
          title: Contraluz
          description: Define a força com que a luz de trás da personagem acende a borda fina em todo o contorno.
        wrap-diffuse:
          title: Largura do contorno de luz
          description: Define até onde a cor do fundo entra pela borda do modelo.
        translucent-wrap:
          title: Menos contorno em partes translúcidas
          description: Multiplica o contorno de luz e a borda pelo quadrado do alfa do modelo. Partes desenhadas com alfa parcial já mostram a área de trabalho através delas.
      preview-shader:
        title: Prévia do shader
        description: Roda o shader de verdade sobre um cartão de teste, com o ambiente ao vivo e as configurações acima.
        window-mapping: O filtro trata esta tela como a janela inteira do palco, então a prévia não é uma cópia exata do palco pixel a pixel.
        filtered: Saída do shader
        unavailable: A prévia precisa de WebGL, e esta janela não conseguiu criar um contexto.
        environment:
          live: A luz vem do último retrato que a janela principal do AIRI publicou.
          neutral: Nenhum retrato chegou ainda, então a prévia usa o ambiente neutro.
        regions:
          title: Regiões do cartão de teste
          body: O corpo largo tem uma rampa de tons de sRGB {low} até {high}. Brilho, contraste, croma e folga aparecem ao longo dela.
          bars: As barras têm {first}, {second}, {third}, {fourth} e {fifth} pixels de largura. Mostram até onde o contorno de luz entra numa forma fina.
          patches: Os dois quadrados são desenhados com alfa {strong} e {weak}, que é onde a opção de contorno translúcido age.
    editor:
      title: Editor do AIRI
      description: Abre a janela separada do Editor do AIRI
      button: Abrir editor
    lag-visualizer:
      title: Visualizador de atraso
    live2d-motion:
