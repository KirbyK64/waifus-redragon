screen-capture:
  permissions-prompt:
    title: Captura de tela
    description: Para capturar telas ou janelas, é preciso permissão de gravação da tela e do áudio do sistema.
    open-preferences: Abrir Ajustes do Sistema
    dismiss: Dispensar
    instructions:
      step-1: Abra os "Ajustes do Sistema" e escolha "Privacidade e Segurança" na barra lateral.
      step-2: Nas seções "Gravação de Tela e Áudio do Sistema" e "Somente Gravação de Áudio do Sistema", ligue as chaves do AIRI.
      step-2-note: Se o AIRI não aparecer na lista, adicione manualmente pelo botão "+" e escolha o AIRI na pasta Aplicativos.
